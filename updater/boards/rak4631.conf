# Board Kconfig for rak4631. Appended to prj.conf.

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default (board .conf files are
# *appended*, so the last assignment wins). What a human reads in a scan list
# next to several identical-looking updaters; nothing parses it.
CONFIG_BT_DEVICE_NAME="RAK4631 Updater"

# ---- Link where the partition table says, and build a .uf2 -----------------
#
# Both of these are in the XIAO nRF52840's *board defconfig* upstream and in
# no board file here, which is exactly why they are easy to lose when the same
# SoC arrives on a different board. Zephyr's rak4631 defconfig sets neither.
#
# USE_DT_CODE_PARTITION is the load-bearing one: without it the image links at
# the start of flash0 rather than at `zephyr,code-partition`, so it builds and
# flashes and MCUboot then jumps into something that is not a vector table.
CONFIG_USE_DT_CODE_PARTITION=y

# The bootloader on this board takes a .uf2 by drag-and-drop, which is the
# install path that needs no tooling at all and the recovery path from a bad
# image. build.sh reads both of these out of the build rather than knowing
# them per board — a missing family ID silently produces a file no bootloader
# will accept — so declaring them is all that is needed here.
CONFIG_BUILD_OUTPUT_UF2=y

# ---- No serial console: drop the USB stack (~18 KB) ------------------------
#
# This board carries no console. The USB device stack existed only to present a
# CDC ACM serial port for the bench log (and the 1200-baud DFU touch that rides
# on it); at ~18 KB it was the single largest reclaimable block in an image that
# runs near its 380 KB slot, and in the field — a unit in the air with nothing
# plugged in — it does nothing. So it is gone.
#
# What still gives you a log: the BLE log backend (src/log_stream.c) streams the
# device log to the web client over the same GATT link it flashes over, and the
# LoRa status messages narrate a DFU on the mesh. What is gone: the wired
# /dev/ttyACM console (capture.py), and the 1200-baud auto-touch — double-tap
# RESET enters the nRF52840 bootloader instead, and UF2 drag-and-drop reflashing
# is unaffected (that is the bootloader's own USB, not this stack).
#
# To bring a wired console back later, two options are recorded in
# reference_xiao_ble_ota_flasher (memory): (B) route the console to a hardware
# UART read with a USB-TTL dongle — still frees the ~18 KB; (C) console over RTT
# with a SWD probe. Both keep a console; this build keeps neither.
#
# The devicetree half (removing the cdc_acm_uart node and its five `chosen`
# entries) is in boards/rak4631.overlay. usb_dfu_touch.c is CMake-gated on
# CONFIG_USBD_CDC_ACM_CLASS, so it drops out on its own.
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
# UART_LINE_CTRL existed only for the 1200-baud touch's uart_line_ctrl_get().
CONFIG_UART_LINE_CTRL=n

# ---- Battery ---------------------------------------------------------------
# A `voltage-divider` node in this board's overlay. CONFIG_VOLTAGE_DIVIDER is
# `default y` once such a node exists and selects ADC itself, so the sensor
# subsystem is the only thing that has to be asked for by name.
CONFIG_SENSOR=y

# ---- LoRa: MeshCore status messages ----------------------------------------
#
# The only board here with a radio. Zephyr's own rak4631_nrf52840.dts already
# describes it — `lora0 = &lora`, an sx1262 on spi1 with RXEN on P1.05, DIO2
# driving TXEN, and a 3V3 TCXO — and those pins are exactly the ones MeshCore
# drives on this board, so there is no devicetree work here at all. Nothing
# collides with the RAK15001: the flash is on QSPI (all P0.x), the radio is on
# spi1 (all P1.x), and 900 MHz is not 2.4 GHz.
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_LORA_SX126X=y

# AES-128-ECB, SHA-256 and HMAC-SHA256 for the MeshCore channel cipher. All
# three are already-linked algorithms — BT_SMP pulls PSA in — but each one has
# to be asked for by name or the call fails at *run time* with
# PSA_ERROR_NOT_SUPPORTED, which looks like a radio fault and is not one.
#
# ECB is the one to watch. It is a foot-gun in general and some PSA
# configurations leave it out on purpose; MeshCore uses it, so matching it is
# the requirement.
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# ---- Flash diet: reclaim ~2.2 KB with no loss of function -------------------
#
# The RAK4631 app image runs close to its 380 KB slot, so four defaults that
# cost flash but buy nothing here are turned off. Measured 2026-09-17: they
# reclaim ~2.2 KB, taking this build to 383,920 B (98.70%) with ~5 KB free.
#
# AES-192 and AES-256 key support: MeshCore group crypto is AES-128 and BLE is
# AES-128, so the larger key schedules are dead weight. NCS enables all three.
CONFIG_PSA_WANT_AES_KEY_SIZE_192=n
CONFIG_PSA_WANT_AES_KEY_SIZE_256=n
# mcumgr os-group echo: a debug round-trip command the web client never sends.
CONFIG_MCUMGR_GRP_OS_ECHO=n
# GATT robust caching + Service Changed: track whether a bonded client's cached
# DB is stale. This device's GATT DB is static, so a client simply rediscovers
# on reconnect; nothing depends on being told the DB changed.
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
